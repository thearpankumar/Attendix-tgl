[package]
name = "attendance-geotag-backend"
version = "2.5.4"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace", "request-id", "limit", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
redis = { version = "1.4", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
argon2 = "0.5"
bcrypt = "0.19"
webauthn-rs = { version = "0.5", features = [
    # Ceremony state is persisted in `webauthn_challenges.state` between the
    # start and finish requests, which are separate HTTP calls.
    "danger-allow-state-serialisation",
    # Passkey autofill on the attendance page (discoverable credentials).
    "conditional-ui",
    # Enrollment stores resident keys so autofill can discover them.
    "resident-key-support",
] }
# Only for ResidentKeyRequirement, which webauthn-rs's prelude doesn't
# re-export. Same "0.5" range as webauthn-rs above so Cargo unifies both to
# one resolved version instead of a future `cargo update` deadlocking an
# exact pin against whatever webauthn-rs pulls transitively.
webauthn-rs-proto = "0.5"
ciborium = "0.2"
# `default-features = false` drops the `rustls` feature, which pulls
# aws-smithy-runtime/tls-rustls -> the legacy hyper-0.14 + rustls 0.21.12 +
# rustls-webpki 0.101.7 stack. That stack is what RUSTSEC-2026-0098/0099/0104
# fire on, and those suppressions were sitting in .cargo/audit.toml with no
# rationale. `rustls-aws-lc` gives the modern rustls 0.23 path instead.
aws-config = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
    "default-https-client",
    "credentials-process",
    "sso",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
    "sigv4a",
    "http-1x",
    "default-https-client",
] }
image = "0.25"
image_hasher = "3"
rust_xlsxwriter = "0.96"
calamine = "0.36"
captcha = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
axum-prometheus = "0.10"
validator = { version = "0.20", features = ["derive"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
subtle = "2.6"
futures = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
aws-types = "1.5.0"
reqwest = { version = "0.13", features = ["json"] }
once_cell = "1.21"
dashmap = "6"
face_id = "0.4"
openssl = { version = "0.10.81", features = ["vendored"] }
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[dev-dependencies]

tokio-test = "0.4"
mockall = "0.15"
wiremock = "0.6"
pretty_assertions = "1.4"

rstest = "0.26"
# file_locks: cargo-nextest runs every test in its own fresh OS process, so
# serial_test's default in-process Mutex never sees real contention between
# #[serial(...)]-tagged tests — it silently provided zero cross-test
# protection under nextest specifically (plain `cargo test` runs tests as
# threads in one process, where the default mode does work). file_locks
# switches to an OS-level file lock, which is cross-process safe.
serial_test = { version = "3.5", features = ["file_locks"] }
tempfile = "3"
axum-test = "21"
tower-test = "0.4"
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

[[test]]
name = "unit"
path = "tests/unit/lib.rs"

[[test]]
name = "middleware"
path = "tests/middleware/lib.rs"

[[test]]
name = "integration"
path = "tests/integration/lib.rs"
required-features = ["integration-tests"]

[[test]]
name = "security"
path = "tests/security/lib.rs"
required-features = ["integration-tests"]

[[test]]
name = "e2e"
path = "tests/e2e/lib.rs"
required-features = ["integration-tests"]

[features]
default = []
integration-tests = []

[profile.test]
opt-level = 1

[profile.release]
# Fast local release builds without LTO
strip = true
opt-level = 3
panic = "abort"

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
