services:

  backend:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    deploy:
      replicas: 1
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-attendance_geotag}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
    volumes:
      - ./backend-rust/src:/app/src:ro
