# Production "app" stack: redis, backend, and the two frontends.
# PostgreSQL and Caddy/fail2ban live in their own files on purpose (so routine
# app work here never has the DB/proxy config in view) — always run all
# three together:
#   aws ecr get-login-password --region ${AWS_REGION:-ap-south-1} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml -f docker-compose.caddy.yml pull
#   docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml -f docker-compose.caddy.yml up -d
#
# Images are built and pushed to ECR by .github/workflows/deploy-production.yml
# on every push to the `production` branch, tagged `<service>-<git-sha>` and
# `<service>-latest`. Set IMAGE_TAG to a git sha in .env to pin a specific
# build instead of always pulling latest.
# ECR_REGISTRY / ECR_REPOSITORY default to the tgl/attendix repo below;
# override in .env only if the registry ever changes.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:

  redis:
    image: redis:7-alpine
    container_name: attendance-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    logging: *default-logging
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - db-net

  
  backend:
    image: ${ECR_REGISTRY:-559444199242.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY:-tgl/attendix}:backend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # Exact origins only; the backend rejects `*` and refuses to start on an
      # unparseable entry rather than falling back to allow-any.
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Subnet of the reverse proxy, so X-Forwarded-For can be trusted for
      # rate-limit keying. Empty means the socket peer is always used.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Bearer token Prometheus presents to scrape /metrics.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - PORT=5000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-attendance_geotag}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=7d
      - ADMIN_SECRET=${ADMIN_SECRET}
      # Only s3 is implemented as a StorageProvider (backend-rust/src/storage) — no Cloudinary support.
      - STORAGE_PROVIDER=s3
      # AWS S3
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # WebAuthn
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Attendix Attendance System}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-xenkrypt.in}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://xenkrypt.in}
      # Database Pool (names must match backend-rust/src/config/mod.rs::AppConfig::from_env)
      - PG_MAX_POOL_SIZE=${PG_MAX_POOL_SIZE:-300}
      - PG_MIN_POOL_SIZE=${PG_MIN_POOL_SIZE:-20}
      - DEV_BYPASS_ALL=${DEV_BYPASS_ALL:-false}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db-net
      - web-net


  admin-frontend:
    image: ${ECR_REGISTRY:-559444199242.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY:-tgl/attendix}:admin-frontend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    logging: *default-logging
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      - backend
    networks:
      - web-net

  
  student-frontend:
    image: ${ECR_REGISTRY:-559444199242.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY:-tgl/attendix}:student-frontend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    logging: *default-logging
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    depends_on:
      - backend
    networks:
      - web-net


  home-frontend:
    image: ${ECR_REGISTRY:-559444199242.dkr.ecr.ap-south-1.amazonaws.com}/${ECR_REPOSITORY:-tgl/attendix}:home-frontend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - web-net

volumes:
  redis_data:

networks:
  db-net:
    driver: bridge
  web-net:
    driver: bridge
