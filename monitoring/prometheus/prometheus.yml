global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Per-container CPU/memory/network — works out of the box, no app code needed.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Host-level CPU/memory/disk — works out of the box, no app code needed.
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Caddy's metrics-only :2019 listener (see Caddyfile.prod). This used to be
  # the admin API listener, which also exposes config read/write.
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ['caddy:2019']

  # Backend Rust (axum) HTTP metrics via axum-prometheus, exposed at /metrics
  # (see backend-rust/src/routes/mod.rs::metric_layer_and_handle).
  # Uses dns_sd_configs so ALL 3 replicas (deploy.replicas: 3) are scraped
  # individually rather than only whichever replica Docker's round-robin DNS
  # resolves first from a static_configs target.
  - job_name: backend
    dns_sd_configs:
      - names: ['backend']
        type: A
        port: 5000
    metrics_path: /metrics
    # /metrics is no longer world-readable; it requires a trusted-proxy source
    # or this bearer token. Set METRICS_TOKEN identically on the backend.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    relabel_configs:
      # Tag each replica's metrics with its resolved IP address.
      - source_labels: [__address__]
        target_label: instance
