services:

  postgres:
    image: postgres:18-alpine
    container_name: attendance-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETGID
      - SETUID
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-attendance_geotag}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # No weak fallback: a bare `docker compose up` that skips setup.sh (the
      # normal source of .env) must fail loudly here rather than silently
      # start a database with the password "postgres".
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — run scripts/generate-secrets.sh}
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance_geotag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    networks:
      - db-net


  redis:
    image: valkey/valkey:8-alpine
    container_name: attendance-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — run scripts/generate-secrets.sh}
    expose:
      - "6379"
    volumes:
      # Named `valkey_data`, not `redis_data`: this switched from redis:7-alpine
      # to valkey/valkey:8-alpine, and Valkey can't read an RDB file written by
      # a newer Redis (seen locally: "Can't handle RDB format version 12",
      # which crash-loops the container on boot). Giving Valkey its own volume
      # means a deploy never touches whatever the old `redis_data` volume
      # contains — no manual migration/cleanup step to remember. The old
      # volume is orphaned but harmless (only rate-limit/session/deny-list
      # cache, nothing durable) and can be removed manually later.
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
    networks:
      - db-net

  
  backend:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Exact origins only; the backend rejects `*` and refuses to start on an
      # unparseable entry rather than falling back to allow-any.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      # Origin a student's browser reaches the site on, used to build
      # shareable short links. NOT the same as WEBAUTHN_ORIGIN (the RP
      # origin) — links used to be built from that and pointed at :5000.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      # Subnet of the reverse proxy, so X-Forwarded-For can be trusted for
      # rate-limit keying. Empty means the socket peer is always used.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Bearer token Prometheus presents to scrape /metrics.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-attendance_geotag}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env — run scripts/generate-secrets.sh}
      - JWT_EXPIRE=7d
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set in .env — run scripts/generate-secrets.sh}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - PG_MAX_POOL_SIZE=${PG_MAX_POOL_SIZE:-300}
      - PG_MIN_POOL_SIZE=${PG_MIN_POOL_SIZE:-20}
      - DEV_BYPASS_ALL=${DEV_BYPASS_ALL:-false}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Attendix Attendance System}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # A post-RCE attacker can't persist a webshell to a read-only rootfs.
    # /home/appuser/.cache also needs to be writable: the ONNX face model's
    # loader rewrites its HF-hub cache pointer file on every container start
    # (see Dockerfile's entrypoint.sh, which seeds this tmpfs from the
    # read-only .cache-seed baked in at build time) even though the model
    # itself isn't re-downloaded.
    read_only: true
    tmpfs:
      - /tmp
      # appuser is uid/gid 1001 in the image (see Dockerfile's `useradd`);
      # without an explicit uid/gid a tmpfs mount is root-owned and appuser
      # can't write into it.
      - /home/appuser/.cache:uid=1001,gid=1001,mode=0755
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - db-net
      - web-net

  
  admin-frontend:
    build:
      context: ./frontend/admin
      args:
        VITE_BASE_PATH: /owner-of-attendix-xyz/
    container_name: attendance-admin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged (see Dockerfile) runs as the `nginx` user from the
    # start and listens on 8080, not 80 — no capabilities needed at all.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      # Loopback only. Published on 0.0.0.0 these served the admin SPA to the
      # whole LAN, bypassing Caddy's security headers and the obscured path.
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
    networks:
      - web-net


  student-frontend:
    build:
      context: ./frontend/student
      args:
        VITE_DEV_BYPASS_ALL: ${DEV_BYPASS_ALL:-false}
    container_name: attendance-student
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    networks:
      - web-net


  home-frontend:
    build:
      context: ./frontend/home
    container_name: attendance-home
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - web-net


  caddy:
    image: caddy:2-alpine
    container_name: attendance-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      backend:
        condition: service_healthy
      admin-frontend:
        condition: service_started
      student-frontend:
        condition: service_started
      home-frontend:
        condition: service_started
    networks:
      - web-net

  # ponytail: only bans anything on a real Linux Docker host (needs the host
  # firewall via DOCKER-USER) — inert but harmless on Docker Desktop dev.
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: attendance-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=UTC
      - F2B_LOG_TARGET=STDOUT
    volumes:
      - ./fail2ban:/data
      - caddy_logs:/var/log/caddy:ro
    depends_on:
      - caddy

volumes:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  db-net:
    driver: bridge
  web-net:
    driver: bridge
