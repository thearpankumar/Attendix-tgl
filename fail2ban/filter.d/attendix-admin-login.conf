# Matches failed admin login/registration attempts in Caddy's JSON access log
# (see Caddyfile / Caddyfile.prod `log` block).
#
# Validated with `fail2ban-regex` against real Caddy access-log lines. The
# previous `datepattern = "ts":<DATE>\.` scored zero hits: Caddy writes `ts` as
# a float Unix epoch, and `<DATE>` does not match a bare epoch. fail2ban then
# treated every line as "now", which silently made `findtime` meaningless —
# the jail could not correlate attempts within a window, so it effectively
# banned nobody. `{EPOCH}` is the form that matches.
[Definition]
datepattern = "ts":{EPOCH}
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/admin/(login|register)".*"status":(401|403).*$
ignoreregex =
