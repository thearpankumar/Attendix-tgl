# Failed Grafana logins, seen through Caddy's JSON access log.
#
# Grafana is proxied at /logging-grafana-main and had no jail at all, despite
# being the one admin UI reachable from outside and shipping with a default
# `admin` username. Grafana answers a failed login with 401.
#
# Validated with `fail2ban-regex`; see attendix-admin-login.conf for why the
# datepattern must be {EPOCH}.
[Definition]
datepattern = "ts":{EPOCH}
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/logging-grafana-main/login[^"]*".*"status":401.*$
ignoreregex =
