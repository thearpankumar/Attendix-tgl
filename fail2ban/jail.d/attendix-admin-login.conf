# Network-level backstop behind the app's own per-IP limiter
# (backend-rust/src/middleware/rate_limit_middleware.rs) and per-account
# lockout (admins.failed_login_attempts / lock_until). maxretry is higher than
# the app-level threshold on purpose: this jail also catches one IP cycling
# through multiple different usernames, each individually under its own
# lockout threshold.
#
# The app-level limiter is only meaningful now that it keys on the socket peer
# rather than an unvalidated X-Forwarded-For, which any client could vary per
# request. This jail was the sole real protection until that was fixed.
#
# Filter validated with fail2ban-regex against real Caddy log lines; the
# datepattern it shipped with matched nothing, so findtime never applied.
#
# chain=DOCKER-USER is required, not optional: Caddy's ports are published
# via normal Docker bridge port-mapping, so bans on the default INPUT chain
# never actually reach traffic destined for the container.
[attendix-admin-login]
enabled = true
filter = attendix-admin-login
logpath = /var/log/caddy/access.log
backend = auto
findtime = 900
maxretry = 10
bantime = 3600
action = iptables-multiport[name=attendix-admin, chain=DOCKER-USER, port="http,https", protocol=tcp]
