# Brute-force protection for the Grafana login form.
#
# Grafana is the only admin UI reachable from outside the stack. It had no jail
# of its own, and its default username is `admin`. Caddy now also restricts
# /logging-grafana-main* by remote_ip (see Caddyfile.prod); this is the
# defence-in-depth layer for anyone inside those ranges.
#
# chain=DOCKER-USER is required, not optional: Caddy's ports are published via
# normal Docker bridge port-mapping, so bans on the default INPUT chain never
# reach traffic destined for the container.
[attendix-grafana-login]
enabled = true
filter = attendix-grafana-login
logpath = /var/log/caddy/access.log
backend = auto
findtime = 900
maxretry = 8
bantime = 3600
action = iptables-multiport[name=attendix-grafana, chain=DOCKER-USER, port="http,https", protocol=tcp]
