name: Deploy to Production

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Needed for both AWS OIDC (assume role without a stored key) and
      # cosign keyless signing (mints a short-lived cert off this token via
      # Fulcio, records the signature in the public Rekor transparency log —
      # no signing key to generate, store or rotate).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend-rust
            dockerfile: ./backend-rust/Dockerfile
            build-args: ""
          - image: admin-frontend
            context: ./frontend/admin
            dockerfile: ./frontend/admin/Dockerfile
            build-args: |
              VITE_BASE_PATH=/owner-of-attendix-xyz/
          - image: mentor-frontend
            context: ./frontend/mentor
            dockerfile: ./frontend/mentor/Dockerfile
            build-args: |
              VITE_BASE_PATH=/mark-attendance/
          - image: student-frontend
            context: ./frontend/student
            dockerfile: ./frontend/student/Dockerfile
            build-args: |
              VITE_DEV_BYPASS_ALL=false
          - image: home-frontend
            context: ./frontend/home
            dockerfile: ./frontend/home/Dockerfile
            build-args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Static keys for now — reverted from OIDC (role-to-assume) because
      # AWS_DEPLOY_ROLE_ARN doesn't exist yet: it needs a GitHub OIDC
      # identity provider + IAM role with a trust policy for
      # token.actions.githubusercontent.com created in the AWS account that
      # actually owns this ECR repo, which nobody has set up yet. These are
      # the same AKIA keys that sit in .env, so a leak from either place is
      # a leak from both, and they never expire — migrate to OIDC once
      # someone with access to the right account creates that role and adds
      # AWS_DEPLOY_ROLE_ARN as a secret, then swap this step back to
      # `role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}`.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built and loaded locally first (not pushed yet) so Trivy can scan the
      # exact image before it ever reaches the registry or a production host.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          tags: |
            local/${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Re-run through buildx (fully cache-hit off the scan build above, so
      # this doesn't recompile/rebuild anything) to push with SBOM and SLSA
      # provenance attestations attached — buildx can only attest at push
      # time to a registry, not on a `--load`ed local image.
      - name: Push image with attestations
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.image }}-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.image }}-latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: signs the immutable digest (not the mutable `-latest` tag)
      # using the job's own OIDC identity. Anyone can later verify with
      # `cosign verify --certificate-identity-regexp '...' --certificate-oidc-issuer
      # https://token.actions.githubusercontent.com <image>@<digest>` — no
      # shared secret to leak or rotate.
      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"
