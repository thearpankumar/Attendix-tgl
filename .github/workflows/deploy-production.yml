name: Deploy to Production

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  ci:
    name: CI Pipeline
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push (${{ matrix.image }})
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend-rust
            dockerfile: ./backend-rust/Dockerfile
            build-args: ""
          - image: admin-frontend
            context: ./frontend/admin
            dockerfile: ./frontend/admin/Dockerfile
            build-args: |
              VITE_BASE_PATH=/owner-of-attendix-xyz/
          - image: student-frontend
            context: ./frontend/student
            dockerfile: ./frontend/student/Dockerfile
            build-args: |
              VITE_DEV_BYPASS_ALL=false
          - image: home-frontend
            context: ./frontend/home
            dockerfile: ./frontend/home/Dockerfile
            build-args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.image }}-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.image }}-latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
