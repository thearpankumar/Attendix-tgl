name: CI Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

# Explicit least privilege. Without this block the workflow inherits the
# repository default, which on many orgs is contents: write.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter to list PR files via the API
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # For pull_request events this compares against the PR's base branch via
      # the GitHub API (no git history needed); `base` is ignored in that case.
      # For push events (this workflow only pushes to master, a long-lived
      # branch) it compares against the commit before the push.
      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            mobile:
              - 'mobile/**'

  backend-rust-test:
    name: Backend Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run clippy
        run: cargo clippy -- -D warnings
        env:
          CARGO_INCREMENTAL: 0

      - name: Run tests
        run: |
          cargo nextest run --locked --all-features
          cargo test --doc --locked --all-features
        env:
          CARGO_INCREMENTAL: 0

  frontend-admin-test:
    name: Frontend Admin Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-admin-coverage
          path: frontend/admin/coverage/
          retention-days: 7

  frontend-mentor-test:
    name: Frontend Mentor Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mentor

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/mentor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-mentor-coverage
          path: frontend/mentor/coverage/
          retention-days: 7

  frontend-student-test:
    name: Frontend Student Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/student

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/student/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-student-coverage
          path: frontend/student/coverage/
          retention-days: 7

  mobile-test:
    name: Mobile Tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7

      # Not a native build (that's what EAS Build in mobile-release.yml is
      # for) — this bundles the JS/TS graph through Metro the way a real
      # build would, which is enough to catch broken imports, bad JSX, or
      # anything expo-router can't resolve without needing Xcode/Android SDK
      # on the runner.
      - name: Verify Metro bundle (JS build check)
        run: npx expo export --platform all --output-dir /tmp/mobile-export-check

  extension-test:
    name: Extension Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build and validate Chrome (MV3) package
        run: |
          npm run build
          npm run validate

      - name: Build and validate Firefox (MV2) package
        run: |
          npm run build:firefox
          npm run validate:firefox

  frontend-home-test:
    name: Frontend Home Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/home

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linting
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run build
        run: bun run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit backend-rust dependencies
        run: |
          cd backend-rust
          cargo audit
        continue-on-error: false

      - name: Audit frontend/admin dependencies
        run: |
          cd frontend/admin
          echo "=== Frontend Admin Security Audit ==="
          npm audit --audit-level=high
        continue-on-error: false

      - name: Audit frontend/mentor dependencies
        run: |
          cd frontend/mentor
          echo "=== Frontend Mentor Security Audit ==="
          npm audit --audit-level=high
        continue-on-error: false

      - name: Audit frontend/student dependencies
        run: |
          cd frontend/student
          echo "=== Frontend Student Security Audit ==="
          npm audit --audit-level=high
        continue-on-error: false

      # continue-on-error here (unlike every other audit step in this job):
      # 17 high-severity findings remain, both dev-tooling-only (never in the
      # shipped JS bundle a user's phone runs) and both empirically confirmed
      # unfixable without breaking something real — don't "fix" either by
      # forcing versions via package.json overrides without re-verifying with
      # a real `expo export` / `eas --version`, not just a clean audit:
      #   - image-size (GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq), via
      #     metro -> @expo/metro -> expo/react-native/reanimated. Every
      #     image-size release npm knows about is still marked affected, and
      #     the one available workaround (aliasing the package to a
      #     differently-shaped fork via overrides) crashes Metro's real
      #     bundler outright (confirmed via `expo export`).
      #   - minimatch (GHSA-3ppc-4f35-3m26 / -7r86-cg39-jmmj / -23c5-xmqv-rm74),
      #     via eas-cli's dependency tree, which contains multiple different
      #     minimatch majors at different depths (an old vulnerable one AND
      #     an already-patched newer one with a different export shape).
      #     Overriding "minimatch" collapses both to one version and breaks
      #     whichever consumer needed the other shape (confirmed via
      #     `eas --version` crashing with "minimatch_1.minimatch is not a
      #     function") — npm overrides can't target only the vulnerable
      #     occurrence without also touching the safe one in this tree.
      # (Several other eas-cli advisories — ajv, diff, joi, nanoid, tar,
      # ts-deepmerge, yaml — plus a separate uuid advisory via
      # xcode -> @expo/config-plugins, ARE fixed; see package.json's
      # `overrides`.) Re-run without this continue-on-error once upstream
      # ships fixes metro/eas-cli can actually pick up.
      - name: Audit mobile dependencies
        run: |
          cd mobile
          echo "=== Mobile Security Audit ==="
          npm audit --audit-level=high
        continue-on-error: true

      - name: Setup Bun for home audit
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Audit frontend/home dependencies
        run: |
          cd frontend/home
          echo "=== Frontend Home Security Audit ==="
          bun audit --audit-level=high
        continue-on-error: false

      # continue-on-error here (like the mobile job above, for the same
      # reason): 4 high-severity findings (image-size's ICNS/JXL/HEIF DoS
      # parsers, GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq) come from
      # addons-linter, a transitive dependency of `web-ext` — itself a
      # transitive/optional dependency of `wxt` (this extension's build tool)
      # used only for `wxt zip`/`wxt submit`, never bundled into the built
      # extension a browser actually loads. `npm audit fix` confirms the only
      # available fix is downgrading wxt to 0.20.27 and web-ext to 5.5.0 —
      # both semver-major regressions to the core build tool, not something
      # to do to chase a dev-only lint dependency's transitive image parser.
      # These packages were already present in this lockfile (via wxt) before
      # this job existed; re-run without this continue-on-error once upstream
      # ships a fix wxt can actually pick up.
      - name: Audit extension dependencies
        run: |
          cd extension
          echo "=== Extension Security Audit ==="
          npm audit --audit-level=high
        continue-on-error: true

  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [changes, backend-rust-test, frontend-admin-test, frontend-mentor-test, frontend-student-test, mobile-test, extension-test, frontend-home-test, security-audit]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          # mobile-test is intentionally skipped (not failed) when mobile/**
          # didn't change (see the `changes` job) - only backend-rust-test,
          # frontend-mentor-test etc. are always required.
          if [ "${{ needs.changes.result }}" != "success" ] || \
             [ "${{ needs.backend-rust-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-admin-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-mentor-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-student-test.result }}" != "success" ] || \
             { [ "${{ needs.mobile-test.result }}" != "success" ] && [ "${{ needs.mobile-test.result }}" != "skipped" ]; } || \
             [ "${{ needs.extension-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-home-test.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
